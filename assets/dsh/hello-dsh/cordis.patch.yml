# Hello.'s layer over the web bundle: the Hello theme and brand. The official
# brand row is turned off so Hello's mark and name hold the sidebar's brand slots.
- insert:
    - id: hello-theme
      name: hello-dsh
- id: ui-brand-official
  disabled: true
# Hello.'s window is dark, so the surface starts dark. This is only the
# default, beneath the profile's own layer: dsh's Settings > Appearance writes
# the person's choice there, and that choice is what the surface shows.
- id: ui-theme
  config:
    preference: dark
